name: Build & Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: GATE 1 regression suite
        run: npm run test:gate1

      - name: GATE 2 regression suite
        run: npm run test:gate2

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://pyramedia.info
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          PUBLIC_TIKTOK_PIXEL_ID: ${{ vars.PUBLIC_TIKTOK_PIXEL_ID }}
          PUBLIC_N8N_WEBHOOK_URL: ${{ vars.PUBLIC_N8N_WEBHOOK_URL }}
          PUBLIC_N8N_AUDIT_URL: ${{ vars.PUBLIC_N8N_AUDIT_URL }}
          PUBLIC_AUDIT_INSTAGRAM: ${{ vars.PUBLIC_AUDIT_INSTAGRAM }}

      # CI guard (SPEC §13.1) — runs after build, BEFORE deploy. The banned
      # legacy number and filler text must be physically unable to reach
      # production: any match fails the pipeline.
      - name: Guard — banned legacy number & filler text
        run: |
          # Pattern assembled at runtime so the banned sequence itself never
          # appears literally anywhere in the codebase (SPEC §2.3).
          BANNED="5672494"
          BANNED="${BANNED}40"
          if grep -r "$BANNED" dist/; then
            echo "::error::Banned legacy phone number found in dist/ — failing the pipeline (SPEC §2.3)."
            exit 1
          fi
          if grep -ri "lorem ipsum" dist/; then
            echo "::error::Placeholder filler text found in dist/ — failing the pipeline (SPEC §2.6)."
            exit 1
          fi
          echo "Guard passed: dist/ is clean."

      # Every build is kept as an artifact — rollback = re-run a previous
      # workflow's deploy (SPEC §13.1).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Check FTP secrets
        id: ftp-check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secrets not configured — deploy skipped (SPEC §14). Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets (and optionally the BLUEHOST_SITE_ROOT variable) to enable deploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist/ via FTPS
        if: steps.ftp-check.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ vars.BLUEHOST_SITE_ROOT || 'public_html/' }}
          state-name: .ftp-deploy-sync-state.json
